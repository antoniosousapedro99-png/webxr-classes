<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bounce Lab</title>
  <meta name="description" content="Bouncing balls in mixed reality (WebXR): drop six real-size balls onto surface mats on your classroom floor, measure the rebound, and compare energy and momentum losses.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="config.js"></script>
</head>
<body>
  <div id="overlay">
    <h1>Bounce Lab</h1>
    <p>Surface mats on your real floor and six real-size balls: drop them by hand, read the rebound height from a slow-motion replay, record your results and compare them with the whole class.</p>
    <div class="buttons">
      <button id="btn-ar" disabled>Checking for mixed reality…</button>
      <button id="btn-vr" class="secondary" hidden>Enter VR</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
