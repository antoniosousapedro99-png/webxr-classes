<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC Builder Lab</title>
  <meta name="description" content="Build your own computer from real parts in mixed reality (WebXR) and check that everything is compatible.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <h1>PC Builder Lab</h1>
    <p>Build your own computer from real parts, make sure everything is compatible, then power it on and see how it all works together.</p>
    <div class="buttons">
      <button id="btn-ar" disabled>Checking for mixed reality…</button>
      <button id="btn-vr" class="secondary" hidden>Enter VR</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
