<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cell Explorer</title>
  <meta name="description" content="Investigate accurate 3D animal, plant and bacterial cells in mixed reality (WebXR).">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="config.js"></script>
</head>
<body>
  <div id="overlay">
    <h1>Cell Explorer</h1>
    <p>Investigate animal, plant and bacterial cells thousands of times bigger than life: name every part, pull organelles out, and see what happens when one goes missing.</p>
    <div class="buttons">
      <button id="btn-ar" disabled>Checking for mixed reality…</button>
      <button id="btn-vr" class="secondary" hidden>Enter VR</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
