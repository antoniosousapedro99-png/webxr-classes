<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heart Lab</title>
  <meta name="description" content="Explore a beating human heart in mixed reality (WebXR): chambers, valves, blood flow, the cardiac cycle, exercise and heart conditions.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="config.js"></script>
</head>
<body>
  <div id="overlay">
    <h1>Heart Lab</h1>
    <p>A beating human heart on your desk, and a big one for the whole class: name every part, follow the blood, watch the valves open and shut, and see what exercise and heart disease do.</p>
    <div class="buttons">
      <button id="btn-ar" disabled>Checking for mixed reality…</button>
      <button id="btn-vr" class="secondary" hidden>Enter VR</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
